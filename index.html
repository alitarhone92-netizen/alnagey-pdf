<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>Alnagey PDF</title>
<style>
body {
  font-family: Arial, sans-serif;
  direction: rtl;
  background: #f5f5f5;
  padding: 20px;
}
h1 {
  text-align: center;
}
input {
  width: 100%;
  padding: 10px;
  margin-bottom: 10px;
}
ul {
  list-style: none;
  padding: 0;
}
li {
  background: #fff;
  margin-bottom: 5px;
  padding: 10px;
  border-radius: 5px;
}
</style>
</head>
<body>

<h1>Alnagey Pdf</h1>

<input type="file" multiple accept="application/pdf">
<input type="text" placeholder="بحث عن ملف PDF">

<ul>
  <li>ملف تجريبي 1</li>
  <li>ملف تجريبي 2</li>
</ul>

</body>
</html>
